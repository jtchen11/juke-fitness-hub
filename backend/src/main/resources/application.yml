server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_gym?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}     # 建议也改为环境变量
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      uri: mongodb://localhost:27017/smart_gym_memory

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

ai:
  llm:
    api-key: ${AI_API_KEY:default-key}         # 从环境变量读取
    model: qwen-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

dashscope:
  api-key: ${AI_API_KEY:default-key}   # 给一个非空默认值

face:
  service:
    url: http://localhost:5001
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}

sms:
  enabled: false
  mock-code: '123456'


gym:
  location:
    latitude: 23.142407507050127
    longitude: 113.34582694066887
    radius: 100

